    <style>
      /* Paint the stage before the bundle arrives so there is never a
         white flash between the HTML and the preloader. */
      html { background: #0b0e14; }
      html[data-theme="light"] { background: #e6e8ec; }
      #boot {
        position: fixed;
        inset: 0;
        background: #070910;
        display: grid;
        place-items: center;
      }
      html[data-theme="light"] #boot { background: #d5d9e0; }
      #boot i {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 1px solid rgba(255, 122, 26, 0.9);
        border-right-color: transparent;
        border-bottom-color: transparent;
        animation: bootSpin 1s linear infinite;
      }
      @keyframes bootSpin { to { transform: rotate(360deg); } }
      #root:not(:empty) + #boot { display: none; }
    </style>

    <script>
      /* Apply the stored theme before first paint — no flash of the
         wrong palette on reload. */
      (function () {
        try {
          var stored = localStorage.getItem("wn-theme");
          document.documentElement.dataset.theme = stored === "light" ? "light" : "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
